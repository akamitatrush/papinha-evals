name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pytest pyyaml

      - name: Testes dos avaliadores
        run: python -m pytest tests/ -q

      - name: Fumaça — runner sobre os traces de exemplo
        run: python rodar_evals.py dados/traces_exemplo.jsonl --sem-cor

      - name: Fumaça — montagem dos prompts de juiz
        run: |
          for j in avaliadores/juizes/J*.md; do
            python julgar.py "$j" dados/traces_exemplo.jsonl --dry-run > /dev/null
            echo "ok: $j"
          done

      - name: Fumaça — splits de validação
        run: python validar_juiz.py --modo F01 --so-splits
